# ==============================================================================
# Civic Issue Reporting Platform - Application Configuration
# ==============================================================================
spring.application.name=civic-reporting
server.port=8080

# ------------------------------------------------------------------------------
# Active Profile & Datasource Configuration
# ------------------------------------------------------------------------------
# Default to MySQL datasource. In local development where MySQL is active,
# update the credentials below.
spring.datasource.url=jdbc:mysql://localhost:3306/civic_reporting?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=civic_user
spring.datasource.password=civic_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# File Upload Limits & Storage Directory
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads/issues

# ------------------------------------------------------------------------------
# Static Resources Configuration
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/

# ------------------------------------------------------------------------------
# AI Service Microservice Endpoint (Phase 4-6)
# ------------------------------------------------------------------------------
ai.service.url=http://localhost:8000/api/v1
ai.service.timeout.seconds=10
